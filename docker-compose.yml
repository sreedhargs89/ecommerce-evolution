version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8080:8000" # This is the ONLY public port now
    environment:
      - USER_SERVICE_URL=http://users:8000
      - PRODUCT_SERVICE_URL=http://products:8000
      - ORDER_SERVICE_URL=http://orders:8000
      - PAYMENT_SERVICE_URL=http://payments:8000
      - REDIS_HOST=redis
    depends_on:
      - users
      - products
      - orders
      - redis
    networks:
      - ecommerce-net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - ecommerce-net

  # --- Internal Services (No Public Ports) ---
  users:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.users.main:app --host 0.0.0.0 --port 8000
    # No ports mapped!
    volumes:
      - ./services/users:/app/services/users
    networks:
      - ecommerce-net

  products:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.products.main:app --host 0.0.0.0 --port 8000
    # No ports mapped!
    volumes:
      - ./services/products:/app/services/products
    networks:
      - ecommerce-net

  orders:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.orders.main:app --host 0.0.0.0 --port 8000
    # No ports mapped!
    volumes:
      - ./services/orders:/app/services/orders
    environment:
      - USER_SERVICE_URL=http://users:8000
      - PRODUCT_SERVICE_URL=http://products:8000
      - PAYMENT_SERVICE_URL=http://payments:8000
    networks:
      - ecommerce-net

  payments:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.payments.main:app --host 0.0.0.0 --port 8000
    # No ports mapped!
    volumes:
      - ./services/payments:/app/services/payments
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge
